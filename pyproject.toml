[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyargutils"
version = "0.1.0"
description = "Python library and CLI with utilities for Argentina."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jorge Mantegani" }]

[project.scripts]
pyargutils = "pyargutils.cli:main"

[tool.setuptools.packages.find]
where = ["src"]